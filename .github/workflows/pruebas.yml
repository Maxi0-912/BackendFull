name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias (sin MySQL, las pruebas usan SQLite)
        run: |
          grep -v mysqlclient requirements.txt > req-ci.txt
          pip install -r req-ci.txt
      - name: Revisar configuracion
        run: python manage.py check --settings=TuTallerAUnClicBackend.settings_test
      - name: Correr pruebas
        run: python manage.py test TuTallerApp --settings=TuTallerAUnClicBackend.settings_test -v 2
